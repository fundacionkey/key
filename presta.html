<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Hernández — Presentación Clínica Completa</title>
<style>
  :root{
    --bg:#0b0f19;--bg-2:#111827;--card:#151c2c;--card-2:#1b2438;
    --text:#e6ecff;--muted:#9aa7c7;--accent:#7c9cff;--accent-2:#a78bfa;
    --green:#34d399;--red:#f87171;--amber:#fbbf24;--pink:#f472b6;--cyan:#22d3ee;
    --border:rgba(124,156,255,.18);--shadow:0 20px 60px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 10% -10%,#1a2450 0%,transparent 60%),
               radial-gradient(1000px 700px at 110% 110%,#2a1a4a 0%,transparent 55%),
               var(--bg);
    color:var(--text);overflow:hidden;
  }
  .progress{position:fixed;top:0;left:0;height:3px;width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    z-index:100;transition:width .35s ease;box-shadow:0 0 12px rgba(124,156,255,.6);}

  .deck{position:relative;height:100vh;width:100%;display:flex;align-items:center;justify-content:center;}
  .slide{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:56px 32px 110px;opacity:0;transform:translateY(28px) scale(.98);
    pointer-events:none;transition:opacity .5s ease,transform .5s ease;overflow-y:auto;
  }
  .slide.active{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}

  .card{
    width:min(1150px,100%);
    background:linear-gradient(160deg,var(--card),var(--card-2));
    border:1px solid var(--border);border-radius:24px;padding:42px 46px;
    box-shadow:var(--shadow);backdrop-filter:blur(8px);
  }

  h1{font-size:clamp(26px,3.6vw,44px);font-weight:800;letter-spacing:-.5px;line-height:1.15}
  h2{font-size:clamp(20px,2.4vw,30px);font-weight:700;margin-bottom:16px;letter-spacing:-.3px}
  h3{font-size:clamp(15px,1.4vw,18px);font-weight:700;color:var(--accent);margin-bottom:8px}
  h4{font-size:14px;font-weight:700;margin-bottom:4px}
  p,li{font-size:clamp(13px,1.05vw,15px);line-height:1.6;color:var(--text)}
  .muted{color:var(--muted)}
  .small{font-size:12.5px;color:var(--muted)}

  .eyebrow{
    display:inline-block;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:12px;padding:6px 14px;
    border:1px solid var(--border);border-radius:999px;background:rgba(124,156,255,.07);
  }

  /* Cover */
  .cover{text-align:center}
  .cover .avatar{
    width:110px;height:110px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:800;color:#0b0f19;margin:0 auto 20px;
    box-shadow:0 12px 40px rgba(124,156,255,.35);animation:pulse 4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);box-shadow:0 12px 40px rgba(124,156,255,.35)}
    50%{transform:scale(1.04);box-shadow:0 16px 55px rgba(167,139,250,.5)}
  }
  .cover .subtitle{font-size:clamp(14px,1.4vw,17px);color:var(--muted);margin-top:14px;max-width:760px;margin-left:auto;margin-right:auto}
  .cover .meta{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

  .chip{
    padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
    border:1px solid var(--border);background:rgba(124,156,255,.07);color:var(--text);
  }
  .chip.green{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.1);color:var(--green)}
  .chip.red{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.1);color:var(--red)}
  .chip.amber{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.1);color:var(--amber)}
  .chip.pink{border-color:rgba(244,114,182,.35);background:rgba(244,114,182,.1);color:var(--pink)}
  .chip.cyan{border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.1);color:var(--cyan)}

  .grid{display:grid;gap:14px}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .grid-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .grid-5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

  .tile{
    background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;transition:transform .25s ease,border-color .25s ease,background .25s ease;
  }
  .tile:hover{transform:translateY(-3px);border-color:rgba(124,156,255,.45);background:rgba(124,156,255,.06)}
  .tile .label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .tile .value{font-size:15px;font-weight:600;line-height:1.4}
  .tile .value.big{font-size:20px;font-weight:800;color:var(--accent)}
  .tile p{margin-top:6px;font-size:13.5px;color:var(--muted)}

  ul.clean{list-style:none;padding:0}
  ul.clean li{position:relative;padding-left:20px;margin-bottom:8px;font-size:14px;line-height:1.55}
  ul.clean li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;
    border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(124,156,255,.6)}
  ul.green li::before{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.6)}
  ul.red li::before{background:var(--red);box-shadow:0 0 8px rgba(248,113,113,.6)}
  ul.amber li::before{background:var(--amber);box-shadow:0 0 8px rgba(251,191,36,.6)}
  ul.pink li::before{background:var(--pink);box-shadow:0 0 8px rgba(244,114,182,.6)}
  ul.cyan li::before{background:var(--cyan);box-shadow:0 0 8px rgba(34,211,238,.6)}

  .quote{border-left:3px solid var(--accent-2);padding:12px 18px;margin:16px 0;
    background:rgba(167,139,250,.06);border-radius:0 12px 12px 0;
    font-style:italic;color:#d8def5;font-size:14px;line-height:1.6}

  .section-title{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .section-title .icon{
    width:44px;height:44px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    background:linear-gradient(135deg,rgba(124,156,255,.2),rgba(167,139,250,.2));
    border:1px solid var(--border);
  }

  .timeline{position:relative;padding-left:26px;margin-top:10px}
  .timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(180deg,var(--accent),var(--accent-2),transparent)}
  .timeline .item{position:relative;margin-bottom:16px}
  .timeline .item::before{content:"";position:absolute;left:-26px;top:6px;
    width:14px;height:14px;border-radius:50%;background:var(--bg-2);
    border:2px solid var(--accent);box-shadow:0 0 10px rgba(124,156,255,.6)}
  .timeline .item h4{font-size:14.5px;font-weight:700;margin-bottom:3px}
  .timeline .item p{font-size:13.5px;color:var(--muted)}

  .flag-card{border-radius:14px;padding:18px;border:1px solid var(--border);
    background:rgba(255,255,255,.03);transition:transform .25s ease}
  .flag-card:hover{transform:translateY(-3px)}
  .flag-card.red{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.05)}
  .flag-card.green{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.05)}
  .flag-card.amber{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.05)}
  .flag-card.pink{border-color:rgba(244,114,182,.3);background:rgba(244,114,182,.05)}
  .flag-card.cyan{border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.05)}
  .flag-card.red h3{color:var(--red)}
  .flag-card.green h3{color:var(--green)}
  .flag-card.amber h3{color:var(--amber)}
  .flag-card.pink h3{color:var(--pink)}
  .flag-card.cyan h3{color:var(--cyan)}

  .survival{display:grid;gap:12px}
  .survival .rule{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;
    border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--border);
    transition:border-color .25s ease,transform .25s ease}
  .survival .rule:hover{border-color:rgba(124,156,255,.5);transform:translateX(4px)}
  .survival .num{flex-shrink:0;width:32px;height:32px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0b0f19}
  .survival .rule h4{font-size:14.5px;font-weight:700;margin-bottom:3px}
  .survival .rule p{font-size:13px;color:var(--muted);margin:0;line-height:1.5}

  /* Index */
  .index-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .index-item{padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.03);
    border:1px solid var(--border);cursor:pointer;transition:all .2s ease}
  .index-item:hover{background:rgba(124,156,255,.1);border-color:var(--accent);transform:translateX(4px)}
  .index-item .num{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1.5px}
  .index-item .name{font-size:14px;font-weight:600;margin-top:2px}

  /* Nav */
  .nav{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:12px;background:rgba(15,20,34,.88);
    border:1px solid var(--border);padding:9px 14px;border-radius:999px;
    backdrop-filter:blur(14px);z-index:90;box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .nav button{background:rgba(124,156,255,.12);color:var(--text);border:1px solid var(--border);
    border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;transition:all .2s ease}
  .nav button:hover:not(:disabled){background:var(--accent);color:#0b0f19;transform:scale(1.08)}
  .nav button:disabled{opacity:.35;cursor:not-allowed}
  .nav .counter{font-size:13px;font-weight:700;color:var(--muted);min-width:80px;text-align:center}
  .nav .counter span{color:var(--accent)}

  .dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:6px;z-index:90;max-height:80vh;overflow-y:auto;padding:4px}
  .dots::-webkit-scrollbar{width:0}
  .dots .dot{width:8px;height:8px;border-radius:50%;background:rgba(124,156,255,.22);
    cursor:pointer;transition:all .25s ease;position:relative;flex-shrink:0}
  .dots .dot:hover{transform:scale(1.5);background:var(--accent)}
  .dots .dot.active{background:var(--accent);box-shadow:0 0 10px var(--accent);transform:scale(1.4)}
  .dots .dot::after{content:attr(data-label);position:absolute;right:18px;top:50%;
    transform:translateY(-50%);background:rgba(15,20,34,.95);border:1px solid var(--border);
    padding:4px 10px;border-radius:7px;font-size:11px;white-space:nowrap;opacity:0;
    pointer-events:none;transition:opacity .2s ease;color:var(--text)}
  .dots .dot:hover::after{opacity:1}

  .hint{position:fixed;bottom:22px;right:18px;font-size:11px;color:var(--muted);
    letter-spacing:1px;z-index:80;opacity:.65;text-align:right;line-height:1.5}

  @media (max-width:768px){
    .slide{padding:36px 14px 120px}
    .card{padding:26px 20px;border-radius:18px}
    .dots{display:none}
    .nav{gap:8px;padding:8px 12px}
    .nav button{width:34px;height:34px}
    .hint{display:none}
  }

  .slide::-webkit-scrollbar{width:8px}
  .slide::-webkit-scrollbar-track{background:transparent}
  .slide::-webkit-scrollbar-thumb{background:rgba(124,156,255,.25);border-radius:4px}
  .slide::-webkit-scrollbar-thumb:hover{background:rgba(124,156,255,.5)}

  .slide.active .fade{animation:fadeUp .55s ease both}
  .slide.active .fade:nth-child(1){animation-delay:.04s}
  .slide.active .fade:nth-child(2){animation-delay:.10s}
  .slide.active .fade:nth-child(3){animation-delay:.16s}
  .slide.active .fade:nth-child(4){animation-delay:.22s}
  .slide.active .fade:nth-child(5){animation-delay:.28s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media (max-width:700px){.two-col{grid-template-columns:1fr}}

  .badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;
    letter-spacing:.5px;text-transform:uppercase;margin-right:6px}
  .badge.green{background:rgba(52,211,153,.15);color:var(--green)}
  .badge.red{background:rgba(248,113,113,.15);color:var(--red)}
  .badge.amber{background:rgba(251,191,36,.15);color:var(--amber)}
  .badge.pink{background:rgba(244,114,182,.15);color:var(--pink)}
  .badge.cyan{background:rgba(34,211,238,.15);color:var(--cyan)}

  .kbd{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;
    background:rgba(124,156,255,.15);border:1px solid var(--border);font-family:monospace;color:var(--accent)}
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<div class="deck" id="deck"></div>

<nav class="nav">
  <button id="prev" aria-label="Anterior" title="Anterior (←)">◀</button>
  <div class="counter"><span id="current">1</span> / <span id="total">0</span></div>
  <button id="next" aria-label="Siguiente" title="Siguiente (→)">▶</button>
</nav>

<div class="dots" id="dots"></div>
<div class="hint">
  <span class="kbd">←</span> <span class="kbd">→</span> navegar<br>

      <span class="chip">9 secciones</span>
      <span class="chip green">Análisis documental</span>
    </div>
    <p class="small" style="margin-top:28px">Atajos: <span class="kbd">←</span> <span class="kbd">→</span> <span class="kbd">Espacio</span> <span class="kbd">Home</span> <span class="kbd">End</span></p>
  </div>`
}
];

/* ============================================================
   RENDERIZADO
   ============================================================ */
const deck = document.getElementById('deck');
const dotsContainer = document.getElementById('dots');
const currentSpan = document.getElementById('current');
const totalSpan = document.getElementById('total');
const progress = document.getElementById('progress');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
let index = 0;

// Crear slides
SLIDES.forEach((s, i) => {
  const section = document.createElement('section');
  section.className = 'slide' + (i === 0 ? ' active' : '');
  section.dataset.label = s.label;
  section.innerHTML = s.html;
  deck.appendChild(section);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.dataset.label = s.label;
  dot.addEventListener('click', () => goTo(i));
  dotsContainer.appendChild(dot);
});

totalSpan.textContent = SLIDES.length;

// Índice dinámico (solo si existe el contenedor)
const indexGrid = document.getElementById('indexGrid');
if (indexGrid) {
  const sections = [...new Set(SLIDES.map(s => s.section))];
  sections.forEach(sec => {
    const firstIdx = SLIDES.findIndex(s => s.section === sec);
    const item = document.createElement('div');
    item.className = 'index-item';
    item.innerHTML = `<div class="num">${String(firstIdx + 1).padStart(2,'0')}</div><div class="name">${sec}</div>`;
    item.addEventListener('click', () => goTo(firstIdx));
    indexGrid.appendChild(item);
  });
}

const slides = Array.from(document.querySelectorAll('.slide'));
const dots = Array.from(document.querySelectorAll('.dot'));

function update(){
  slides.forEach((s, i) => s.classList.toggle('active', i === index));
  dots.forEach((d, i) => d.classList.toggle('active', i === index));
  currentSpan.textContent = index + 1;
  progress.style.width = ((index + 1) / slides.length * 100) + '%';
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
  // Scroll al inicio del slide
  slides[index].scrollTop = 0;
}

function goTo(i){
  if (i < 0 || i >= slides.length) return;
  index = i;
  update();
}
function next(){ goTo(index + 1); }
function prev(){ goTo(index - 1); }

nextBtn.addEventListener('click', next);
prevBtn.addEventListener('click', prev);

// ============================================================
// NAVEGACIÓN POR TECLADO — COMPLETA
// ============================================================
document.addEventListener('keydown', (e) => {
  switch(e.key){
    case 'ArrowRight':
    case 'ArrowDown':
    case ' ':
    case 'Spacebar':
    case 'PageDown':
    case 'n':
    case 'N':
    case 'j':
    case 'J':
      e.preventDefault(); next(); break;
    case 'ArrowLeft':
    case 'ArrowUp':
    case 'PageUp':
    case 'p':
    case 'P':
    case 'k':
    case 'K':
      e.preventDefault(); prev(); break;
    case 'Home':
      e.preventDefault(); goTo(0); break;
    case 'End':
      e.preventDefault(); goTo(slides.length - 1); break;
    case 'f':
    case 'F':
      e.preventDefault();
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      break;
  }
});

// Swipe táctil
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, {passive:true});
document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)){
    if (dx < 0) next(); else prev();
  }
}, {passive:true});

// Rueda del ratón
let wheelLock = false;
document.addEventListener('wheel', (e) => {
  const slide = slides[index];
  const atTop = slide.scrollTop <= 0;
  const atBottom = slide.scrollTop + slide.clientHeight >= slide.scrollHeight - 2;
  if (e.deltaY > 0 && !atBottom) return;
  if (e.deltaY < 0 && !atTop) return;
  if (wheelLock) return;
  wheelLock = true;
  setTimeout(() => wheelLock = false, 700);
  if (e.deltaY > 0) next(); else prev();
}, {passive:true});

update();
</script>

</body>
